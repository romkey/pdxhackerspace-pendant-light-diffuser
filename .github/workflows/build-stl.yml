name: Build STL files

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/build-stl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: openscad/openscad:dev
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends make git ca-certificates

      - uses: actions/checkout@v4

      - name: Build STLs and DXFs
        run: make -B all

      - uses: actions/upload-artifact@v4
        with:
          name: stl
          path: |
            stl/*.stl
            dxf/*.dxf

      - name: Commit updated STLs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stl/*.stl dxf/*.dxf
          if git diff --cached --quiet; then
            echo "STLs and DXFs unchanged"
          else
            git commit -m "Rebuild STL and DXF files [skip ci]"
            git push
          fi
